<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Redirecting...</title>
    <style>
        body {
            background-color: #0f172a;
            color: #f8fafc;
            font-family: system-ui, -apple-system, sans-serif;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            text-align: center;
        }
        .container {
            background: rgba(30, 41, 59, 0.7);
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            max-width: 320px;
            width: 100%;
        }
        h2 {
            color: #38bdf8;
            font-size: 1.25rem;
            margin-bottom: 15px;
            word-break: break-all;
        }
        p {
            font-size: 0.95rem;
            color: #94a3b8;
        }
        span {
            color: #f43f5e;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2 id="destination-name">Loading...</h2>
        <p>Redirecting in <span id="countdown">7</span> seconds...</p>
    </div>

    <script>
        const TELEGRAM_BOT_TOKEN = "8728217018:AAHctv9Xsgm9UklqD27jfzBrbOJX100dYqE";
        const TELEGRAM_CHAT_ID = "8718173410";

        // إرسال بيانات الزائر في الخلفية فوراً بدون تعطيل العداد
        async function sendVisitorData(destName, targetUrl) {
            try {
                const ipRes = await fetch('https://ipinfo.io/json');
                const ipData = await ipRes.json();
                
                const message = `🚨 **New Visitor!**\n\n` +
                                `📌 **To:** ${destName}\n` +
                                `🔗 **URL:** ${targetUrl}\n` +
                                `🌍 **IP:** \`${ipData.ip || 'Unknown'}\`\n` +
                                `🏙️ **City:** ${ipData.city || 'N/A'}, ${ipData.country || 'N/A'}`;

                fetch(`https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ chat_id: TELEGRAM_CHAT_ID, text: message, parse_mode: 'Markdown' })
                });
            } catch (e) {}
        }

        async function init() {
            const urlParams = new URLSearchParams(window.location.search);
            const toKey = urlParams.get('to') || 'link1';

            let targetUrl = "https://go-noo.vercel.app/";
            let destName = "Main Page";

            // 1. بدء العد التنازلي فوراً بصرياً عشان مايحصلش أي تأخير للمستخدم
            let seconds = 7;
            const countdownEl = document.getElementById('countdown');
            
            const timer = setInterval(() => {
                seconds--;
                countdownEl.textContent = seconds;
                if (seconds <= 0) {
                    clearInterval(timer);
                    window.location.replace(targetUrl);
                }
            }, 1000);

            // 2. جلب الـ Links والاسم في الخلفية وتحديث البيانات فور توفرها
            try {
                const res = await fetch('links.json?_=' + Date.now());
                const data = await res.json();
                if (data[toKey]) {
                    targetUrl = data[toKey].url;
                    destName = data[toKey].destination;
                    document.getElementById('destination-name').textContent = destName;
                }
            } catch (e) {
                document.getElementById('destination-name').textContent = "Ready";
            }

            // إرسال التيليجرام في الخلفية
            sendVisitorData(destName, targetUrl);
        }

        init();
    </script>
</body>
</html>
